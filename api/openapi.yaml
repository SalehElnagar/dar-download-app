openapi: 3.0.3
info:
  title: DAR Download Application
  version: 2.0.0
  description: >-
    Private service behind a separately deployed OIDC authentication layer. External clients
    authenticate there with a browser session or bearer flow. That trusted layer validates the
    login or token, strips caller-supplied identity headers, and injects the internal identity
    inputs on private app ingress. The application does not implement the browser authorization
    flow or validate customer session or bearer tokens. Every non-GET method receives a bounded
    405 method_not_allowed response.
servers:
  - url: https://downloads.example.invalid
    description: >-
      Trusted OIDC-protected upstream endpoint for external clients. The private app ingress is
      not a public server and must be reachable only from this authentication layer.
paths:
  /healthz:
    get:
      operationId: health
      summary: Report process liveness without identity or storage access
      responses:
        "200":
          description: Healthy process
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/releases/{release_id}/download:
    get:
      operationId: downloadRelease
      summary: Download one exact release authorized for the authenticated OIDC subject
      security:
        - upstreamOIDC: []
      x-trusted-identity-boundary:
        description: >-
          One deployment-selected internal adapter maps authenticated upstream evidence to the
          application's exact issuer and subject. The default adapter uses X-DAR-OIDC-Issuer and
          X-DAR-OIDC-Subject on private ingress. The optional Azure Container Apps adapter uses
          only platform-reserved principal headers and rejects caller X-DAR assertions. These
          internal representations are never public credentials or caller-controlled request
          parameters, and direct app ingress is forbidden.
        modes:
          - oidc_headers
          - azure_container_apps
      parameters:
        - name: release_id
          in: path
          required: true
          example: dar_01JABCDEF0123456789XYZ
          schema:
            type: string
            pattern: ^dar_[A-Za-z0-9_-]{16,96}$
        - name: Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^bytes=(?:[0-9]+-[0-9]*|-[1-9][0-9]*)$'
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Complete current DAR representation
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
            Content-Disposition:
              schema: { type: string }
            Content-Length:
              schema: { type: integer, minimum: 0 }
            ETag:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: One normalized byte range from the current DAR representation
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
            Content-Disposition:
              schema:
                type: string
                pattern: '^attachment; filename="[A-Za-z0-9._-]+[.]dar"$'
            Content-Range:
              schema: { type: string }
            Content-Length:
              schema: { type: integer, minimum: 1 }
            ETag:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "404":
          $ref: "#/components/responses/ReleaseNotFound"
        "413":
          $ref: "#/components/responses/ReleaseTooLarge"
        "416":
          description: Malformed, unsupported, or unsatisfiable range
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Range:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid_range }
        "502":
          $ref: "#/components/responses/StorageUnavailable"
components:
  securitySchemes:
    upstreamOIDC:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
      description: >-
        External authentication requirement enforced by the trusted upstream OIDC layer. The
        layer may use a browser session or validate a bearer token. The app never processes
        this public credential. Clients must not send or rely on any internal identity headers.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service: { type: string, enum: [dar-download] }
        status: { type: string, enum: [ok] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - authentication_required
            - authorization_denied
            - invalid_range
            - method_not_allowed
            - release_not_found
            - release_too_large
            - storage_unavailable
  responses:
    AuthenticationRequired:
      description: Trusted upstream OIDC identity evidence is absent or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: authentication_required }
    AuthorizationDenied:
      description: The exact OIDC subject is not entitled to this exact release
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: authorization_denied }
    ReleaseNotFound:
      description: The configured release or current object does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: release_not_found }
    ReleaseTooLarge:
      description: The current object exceeds the fixed delivery bound
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: release_too_large }
    StorageUnavailable:
      description: Private storage could not safely deliver the current object
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: storage_unavailable }
