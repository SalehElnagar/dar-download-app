openapi: 3.0.3
info:
  title: DAR Download Application
  version: 3.0.0
  description: >-
    Private streaming service behind a separately deployed OIDC authentication layer. External
    clients authenticate there with a browser session or bearer flow. That trusted layer
    validates the login or token, strips caller-supplied identity headers, and injects the
    deployment-selected internal identity representation on private app ingress. The app does
    not implement a browser authorization flow or validate customer session or bearer tokens.
    Every authenticated identity may download every valid exact Blob path in the configured
    container. File and version names are selectors, not authorization boundaries. Every
    non-GET method receives a bounded 405 method_not_allowed response.
servers:
  - url: https://downloads.example.invalid
    description: >-
      Trusted OIDC-protected upstream endpoint for external clients. The private app ingress is
      not a public server and must be reachable only from this authentication layer.
paths:
  /healthz:
    get:
      operationId: health
      summary: Report process liveness without identity or storage access
      responses:
        "200":
          description: Healthy process
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/releases/{version}/download/{file_name}:
    get:
      operationId: downloadReleaseFile
      summary: Download one exact Blob selected by two validated path segments
      description: >-
        After trusted authentication, maps the raw version and file_name segments exactly to
        version/file_name in the configured container. The app does not list or enumerate the
        container. Percent-encoded, nested, Unicode, control-character, and ambiguous path forms
        are rejected. Authentication occurs before any Blob existence check.
      security:
        - upstreamOIDC: []
      x-trusted-identity-boundary:
        description: >-
          One deployment-selected internal adapter maps authenticated upstream evidence to the
          application's configured issuer and one authenticated subject. The default adapter
          uses X-DAR-OIDC-Issuer and X-DAR-OIDC-Subject on private ingress. The optional Azure
          Container Apps adapter uses only platform-reserved principal headers and rejects caller
          X-DAR assertions. These internal representations are never public credentials or
          caller-controlled request parameters, and direct app ingress is forbidden. No
          subject-level authorization is performed after authentication.
        modes:
          - oidc_headers
          - azure_container_apps
      parameters:
        - name: version
          in: path
          required: true
          description: >-
            Raw 1-to-96-byte ASCII segment. Letters, digits, dot, underscore, and hyphen are
            allowed, but a dot-only value is not. Percent encoding is rejected.
          example: v26.8.31.01
          schema:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^[.]*[A-Za-z0-9_-][A-Za-z0-9._-]*$'
        - name: file_name
          in: path
          required: true
          description: >-
            Raw 1-to-128-byte safe ASCII basename. Letters, digits, dot, underscore, and hyphen
            are allowed, but a dot-only value is not. Percent encoding is rejected. The filename
            is not an authorization boundary.
          example: canton_dars.zip
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[.]*[A-Za-z0-9_-][A-Za-z0-9._-]*$'
        - name: Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
            pattern: '^bytes=(?:[0-9]+-[0-9]*|-[1-9][0-9]*)$'
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Complete current Blob representation
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
            Content-Disposition:
              schema:
                type: string
                pattern: '^attachment; filename="[.]*[A-Za-z0-9_-][A-Za-z0-9._-]*"$'
            Content-Length:
              schema: { type: integer, minimum: 0 }
            ETag:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: One normalized byte range from the current Blob representation
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
            Content-Disposition:
              schema:
                type: string
                pattern: '^attachment; filename="[.]*[A-Za-z0-9_-][A-Za-z0-9._-]*"$'
            Content-Range:
              schema: { type: string }
            Content-Length:
              schema: { type: integer, minimum: 1 }
            ETag:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ReleaseNotFound"
        "413":
          $ref: "#/components/responses/ReleaseTooLarge"
        "416":
          description: Malformed, unsupported, or unsatisfiable range
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Range:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid_range }
        "502":
          $ref: "#/components/responses/StorageUnavailable"
components:
  securitySchemes:
    upstreamOIDC:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
      description: >-
        External authentication requirement enforced by the trusted upstream OIDC layer. The
        layer may use a browser session or validate a bearer token. The app never processes this
        public credential. Clients must not send or rely on internal identity headers.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service: { type: string, enum: [dar-download] }
        status: { type: string, enum: [ok] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - authentication_required
            - invalid_range
            - method_not_allowed
            - release_not_found
            - release_too_large
            - storage_unavailable
  responses:
    AuthenticationRequired:
      description: Trusted upstream OIDC identity evidence is absent or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: authentication_required }
    ReleaseNotFound:
      description: A path segment is invalid or the exact selected Blob does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: release_not_found }
    ReleaseTooLarge:
      description: The current Blob exceeds the fixed delivery bound
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: release_too_large }
    StorageUnavailable:
      description: Private storage could not safely deliver the current Blob
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: storage_unavailable }
