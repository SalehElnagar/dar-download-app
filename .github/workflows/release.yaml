name: Release signed image

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: gated candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Validate immutable semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            printf '%s\n' 'release tags must use vMAJOR.MINOR.PATCH with an optional safe prerelease.' >&2
            exit 1
          fi

      - name: Check out exact tag without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install checksum-verified security tools
        run: ./scripts/bootstrap-tools.sh

      - name: Run source security gate
        run: ./scripts/prebuild.sh

      - name: Build exact release candidate
        env:
          IMAGE_REF: dar-download-app:release-candidate
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-image.sh

      - name: Scan and dynamically test exact candidate
        env:
          IMAGE_REF: dar-download-app:release-candidate
        run: ./scripts/postbuild.sh

      - name: Create source- and image-bound SLSA provenance predicate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/create-provenance.sh

      - name: Export exact candidate image
        run: docker save --output .security/evidence/candidate-image.tar dar-download-app:release-candidate

      - name: Transfer only the validated candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: .security/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: protected publish
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: image-release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out exact tag without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Receive validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: candidate

      - name: Load and verify candidate identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! -f candidate/candidate-image.tar ]]; then
            printf '%s\n' 'transferred candidate image is missing.' >&2
            exit 1
          fi
          docker load --input candidate/candidate-image.tar
          EVIDENCE_DIR=candidate \
            IMAGE_REF=dar-download-app:release-candidate \
            EXPECTED_REVISION="$GITHUB_SHA" \
            EXPECTED_REPOSITORY="$GITHUB_REPOSITORY" \
            RELEASE_TAG="$RELEASE_TAG" \
            ./scripts/verify-candidate-transfer.sh
          repository=${GITHUB_REPOSITORY,,}
          printf 'IMAGE_NAME=ghcr.io/%s\n' "$repository" >>"$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >>"$GITHUB_ENV"

      - name: Install checksum-verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Authenticate to private GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable release tag
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >/dev/null 2>&1; then
            printf '%s\n' 'the release tag already exists and will not be overwritten.' >&2
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            printf '%s\n' 'the source-addressed candidate tag already exists and will not be overwritten.' >&2
            exit 1
          fi

      - name: Push source-addressed candidate
        run: |
          source_tag="sha-$GITHUB_SHA"
          docker tag dar-download-app:release-candidate "$IMAGE_NAME:$source_tag"
          docker push "$IMAGE_NAME:$source_tag"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$source_tag" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf '%s\n' 'registry did not return a valid immutable digest.' >&2
            exit 1
          fi
          printf 'IMAGE_DIGEST=%s\n' "$digest" >>"$GITHUB_ENV"

      - name: Sign exact digest with GitHub OIDC
        run: cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Attach signed SPDX inventory to exact digest
        run: cosign attest --yes --type spdxjson --predicate candidate/sbom.spdx.json "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Attach signed SLSA provenance to exact digest
        run: cosign attest --yes --type slsaprovenance1 --predicate candidate/provenance.slsa.json "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Verify keyless signature before promotion
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/${{ github.ref_name }}
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_NAME@$IMAGE_DIGEST"
          cosign verify-attestation \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type spdxjson \
            "$IMAGE_NAME@$IMAGE_DIGEST" >candidate/verified-sbom-attestation.json
          cosign verify-attestation \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type slsaprovenance1 \
            "$IMAGE_NAME@$IMAGE_DIGEST" >candidate/verified-provenance-attestation.json

      - name: Promote the attested digest to the release tag
        run: docker buildx imagetools create --tag "$IMAGE_NAME:$RELEASE_TAG" "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Retain successful release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
