name: Security candidate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install checksum-verified security tools
        run: ./scripts/bootstrap-tools.sh

      - name: Run source security gate
        run: ./scripts/prebuild.sh

      - name: Build validated image
        env:
          IMAGE_REF: dar-download-app:ci-candidate
          VERSION: ci-${{ github.sha }}
        run: ./scripts/build-image.sh

      - name: Scan and dynamically test exact image
        env:
          IMAGE_REF: dar-download-app:ci-candidate
        run: ./scripts/postbuild.sh

      - name: Retain successful digest-bound evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence-${{ github.run_id }}
          path: .security/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
